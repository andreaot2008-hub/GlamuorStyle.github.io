<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glamour Style - Iniciar Sesión</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="../img/logo.JPG" alt="Glamour Style Logo">
      <span class="logo-text">Glamour Style</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="login.html" class="active">Iniciar Sesión</a></li>
        <li><a href="register.html">Registro</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="logo-container">
        <img src="../img/logo.JPG" alt="Glamour Style Logo">
      </div>
      <h2>Bienvenido</h2>
      <p>Ingresa para descubrir tu estilo</p>

      <form action="#" method="POST">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" placeholder="••••••••" required>
        </div>

        <div class="form-links">
          <a href="reset-password.html">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Glamour Style. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
